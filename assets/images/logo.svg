<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" class="dearly-logo-svg">
  <defs>
    <linearGradient id="dearlyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Envelope Icon -->
  <g transform="translate(6, 10)">
    <!-- Envelope Base -->
    <rect x="2" y="8" width="40" height="28" rx="6" fill="url(#envGrad)" stroke="#FDA4AF" stroke-width="1.8" />
    <!-- Envelope Flap Fold lines -->
    <path d="M3 10 L22 24 L41 10" stroke="#FB7185" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M3 34 L17 22" stroke="#FDA4AF" stroke-width="1.4" stroke-linecap="round" />
    <path d="M41 34 L27 22" stroke="#FDA4AF" stroke-width="1.4" stroke-linecap="round" />
    
    <!-- Heart Seal -->
    <g transform="translate(14, 15) scale(0.7)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            fill="url(#dearlyGrad)" filter="url(#softGlow)" />
    </g>
    
    <!-- Sparkle Accent -->
    <path d="M42 4 L43.5 8 L47.5 9.5 L43.5 11 L42 15 L40.5 11 L36.5 9.5 L40.5 8 Z" fill="#F43F5E" />
  </g>

  <!-- Typography: DEARLY -->
  <text x="62" y="42" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="28" font-weight="800" letter-spacing="1.5" fill="#1F2937">
    DEAR<tspan fill="#E11D48">LY</tspan>
  </text>

  <!-- Subtle Heart Dot over tagline hint -->
  <circle cx="212" cy="22" r="3" fill="#FB7185" />
</svg>
