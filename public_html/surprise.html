<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEARLY — A Special Surprise For You 💌</title>
  <meta name="description" content="Someone who cares about you made a special interactive digital gift just for you on DEARLY.">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">

  <!-- Open Graph -->
  <meta property="og:title" content="A Special Surprise For You 💌">
  <meta property="og:description" content="Open this link to view an interactive personalized gift made with love on DEARLY.">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <style>
    /* Full-screen Recipient Story Presentation */
    body.story-mode {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-attachment: fixed;
    }
    .recipient-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      pointer-events: none;
    }
    .recipient-header > * {
      pointer-events: auto;
    }
    .story-card {
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      padding: 40px 28px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-lg);
      max-width: var(--max-width-story);
      width: 100%;
      margin: 40px auto 20px;
      position: relative;
    }
    .story-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--color-primary-light);
      color: var(--color-primary-hover);
      margin-bottom: 12px;
    }
    .story-progress-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
    }
    .story-progress-pip {
      width: 24px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-light);
      transition: background 0.3s ease;
    }
    .story-progress-pip.active {
      background: var(--color-primary);
    }
    .story-progress-pip.completed {
      background: var(--color-primary-light);
    }
    .story-quote-box {
      margin: 28px 0 32px;
      padding: 20px 16px;
      position: relative;
    }
    .story-quote-mark {
      font-size: 3rem;
      line-height: 1;
      color: var(--color-primary-light);
      font-family: serif;
    }
    .story-quote-mark.end {
      text-align: right;
    }
    .story-quote-text {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.6;
      font-style: italic;
    }
    .story-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .sound-toggle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }
    .sound-toggle-btn:hover {
      transform: scale(1.08);
    }
    .recipient-logo-img {
      height: 40px;
      width: auto;
      transition: transform var(--transition-fast);
    }
    @media (max-width: 480px) {
      body.story-mode {
        padding: 16px 12px;
      }
      .story-card {
        padding: 28px 18px;
        margin: 54px auto 16px;
        border-radius: var(--radius-lg);
      }
      .recipient-header {
        padding: 10px 12px;
        gap: 8px;
      }
      .recipient-logo-img {
        height: 32px !important;
      }
      .btn-music-toggle .music-label {
        display: none;
      }
      .btn-music-toggle {
        padding: 6px 10px !important;
      }
    }
    @media (max-width: 360px) {
      .recipient-header {
        padding: 8px 10px;
      }
      .recipient-logo-img {
        height: 28px !important;
      }
      .btn-bookmark-gift span {
        display: none;
      }
      .btn-bookmark-gift {
        padding: 6px 10px !important;
      }
    }
  </style>
</head>
<body class="story-mode">

  <!-- Ambient Particles -->
  <div id="ambient-particles" class="ambient-particles-container"></div>

  <!-- Subtle Top Header -->
  <header class="recipient-header">
    <a href="index.html" class="logo-link" aria-label="DEARLY Home" style="opacity: 0.95;">
      <img src="assets/images/logo.svg" alt="DEARLY" class="recipient-logo-img">
    </a>
    <div class="recipient-header-actions" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
      <button type="button" class="btn-bookmark-gift" id="btn-bookmark-gift" title="Save this gift to your collection" aria-label="Save this gift" style="border-radius: 999px; font-size: 0.82rem; font-weight: 600; padding: 6px 14px; background: rgba(255, 255, 255, 0.95); border: 1px solid var(--border-light); box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--text-main); transition: transform 0.2s ease;">
        🔖 <span>Save Gift</span>
      </button>
      <div class="music-player-pill" id="dearly-music-control" role="region" aria-label="Background music controls">
        <button type="button" class="btn-music-toggle" id="btn-audio-toggle" title="Play peaceful romantic music" aria-label="Toggle romantic music">
          <span class="music-icon">🎵</span>
          <span class="music-label">Romantic Music</span>
          <span class="music-equalizer" aria-hidden="true">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Story Container -->
  <main style="width: 100%;">
    <div id="story-container">
      <!-- Loading Initial State -->
      <div class="story-card text-center" style="max-width: 440px; margin: 40px auto; padding: 48px 24px;">
        <div style="font-size: 3rem; margin-bottom: 16px;" class="animate-heartbeat">💌</div>
        <h2 style="font-size: 1.35rem; margin-bottom: 8px;">Unwrapping your moment...</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          One second while we prepare your gift.
        </p>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/recipient.js"></script>

  <script>
    // Recipient Bootloader
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      let rawId = (urlParams.get('id') || urlParams.get('public_id') || urlParams.get('demo') || '').trim();
      const experienceId = (rawId && rawId !== 'null' && rawId !== 'undefined') ? rawId : null;
      const container = document.getElementById('story-container');

      if (!experienceId) {
        if (container) {
          container.innerHTML = `
            <div class="story-card text-center" style="max-width: 460px; margin: 40px auto; padding: 40px 24px;">
              <span style="font-size: 3rem;">💌</span>
              <h2 style="font-size: 1.6rem; margin-top: 16px; margin-bottom: 10px;">Missing Gift Link</h2>
              <p style="color: var(--text-muted); font-size: 0.98rem; margin-bottom: 24px;">
                It looks like this link is incomplete. Please check the full link sent by your friend or loved one!
              </p>
              <a href="index.html" class="btn btn-primary">Go to DEARLY Homepage</a>
            </div>
          `;
        }
        return;
      }

      try {
        // Fetch from Supabase or Local Demo
        const data = await window.dearlyDB.getExperienceByPublicId(experienceId);

        if (data) {
          const player = new window.DearlyStoryPlayer({
            container: container,
            isPreview: false,
            data: data
          });
          await player.init();
        } else {
          // If not found, show friendly message
          const dummyPlayer = new window.DearlyStoryPlayer({ container: container });
          dummyPlayer.renderNotFound();
        }
      } catch (err) {
        console.error('Error fetching recipient experience:', err);
        const dummyPlayer = new window.DearlyStoryPlayer({ container: container });
        dummyPlayer.renderNotFound();
      }

      // Audio Controls setup
      if (window.dearlyAudio) {
        window.dearlyAudio.init();
      }
    });
  </script>
</body>
</html>
